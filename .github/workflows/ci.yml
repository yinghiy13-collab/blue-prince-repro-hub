name: sovereign-baseline-ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

jobs:
  ast-miron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run REAL AST Parser
        run: |
          mkdir -p dist
          python src/ast_parser.py
          cp evidence/ast.json dist/ast.json
          cat dist/ast.json
      - uses: actions/upload-artifact@v4
        with:
          name: ast-evidence
          path: dist/ast.json
          if-no-files-found: error

  evidence-verifier:
    runs-on: ubuntu-latest
    needs: [ast-miron]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ast-evidence
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build provenance
        run: |
          python -c "import json,os; json.dump({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'repository':os.environ['GITHUB_REPOSITORY'],'ref':os.environ['GITHUB_REF']}, open('dist/provenance.json','w'), indent=2)"
      - name: Verify Evidence
        run: |
          pip install -q pyyaml jsonschema
          python src/evidence_verifier.py --evidence dist/ast.json --out dist/verified.json
          python tools/independent_verifier.py --evidence dist/ast.json --verified dist/verified.json --provenance dist/provenance.json --out dist/witness-report.json
          cat dist/witness-report.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/witness-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: witness-report
          path: dist/witness-report.json
          if-no-files-found: error

  release-gate:
    runs-on: ubuntu-latest
    needs: [evidence-verifier]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: witness-report
          path: dist/
      - name: Strict Release Gate
        run: |
          cat dist/witness-report.json
          python -c "import json,sys; j=json.load(open('dist/witness-report.json')); sys.exit(0 if j.get('verdict')=='PASS' and j.get('commit_match') and j.get('evidence_hash_match') else 1)"

  monitor:
    runs-on: ubuntu-latest
    needs: [release-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: witness-report
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/monitor.py
