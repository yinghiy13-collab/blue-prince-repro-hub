name: Layer 2 - PR Assurance (ASSURANCE_READY)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hard-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Required Inputs
        run: |
          test -f src/memory_anchor_validator.py
          test -f src/ast_parser.py
          test -f tests/test_memory_anchor.py
          test -f policy/build_gate.rego
          test -s MEMORY_ANCHOR.lock
          mkdir -p evidence # สร้างโฟลเดอร์รอไว้

      - name: Verify Anchor
        run: python src/memory_anchor_validator.py

      - name: Run Negative Test Suite
        run: python -m unittest tests/test_memory_anchor.py

      - name: Run AST Parser
        run: python src/ast_parser.py

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: '0.60.0'

      - name: OPA Evaluation
        run: |
          RESULT="$(opa eval \
            --format raw \
            --data policy/ \
            --input evidence/ast.json \
            'data.build_gate.allow')"

          if [ "$RESULT" != "true" ]; then
            echo "FAIL-CLOSED: OPA policy denied."
            exit 1
          fi
