name: sovereign-baseline (full production)
on:
  push:
    branches: [main, fix/witness-v14]
  workflow_dispatch:
concurrency:
  group: sovereign-baseline-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ast-miron:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - run: python src/ast_parser.py
      - run: test -s evidence/ast.json
      - uses: actions/upload-artifact@v4.6.2
        with: {name: ast-evidence, path: evidence/ast.json, if-no-files-found: error}
  rego-checker:
    needs: ast-miron
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - uses: open-policy-agent/setup-opa@v2.1.0
      - run: opa test policy/ -v
  code-analyze:
    needs: ast-miron
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - run: python -m py_compile src/*.py tools/*.py
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - run: python -m pip install pip-audit && pip-audit --strict || true
  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - run: pip install bandit && bandit -r src tools backend -lll || true
  evidence-verifier:
    needs: [rego-checker, code-analyze]
    runs-on: ubuntu-24.04
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4.3.0
        with: {name: ast-evidence, path: evidence/}
      - run: python src/evidence_verifier.py
      - run: |
          python - <<'PY'
          import json, os
          meta={"commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"repository":os.environ["GITHUB_REPOSITORY"]}
          open("evidence/provenance.json","w").write(json.dumps(meta, indent=2))
          PY
      - uses: actions/attest@v1.4.1
        with: {subject-path: evidence/ast.json, predicate-type: https://blue-prince.dev/evidence/v1, predicate-path: evidence/provenance.json}
      - uses: actions/upload-artifact@v4.6.2
        with: {name: verified-evidence, path: "evidence/*.json", if-no-files-found: error}
  witness:
    needs: evidence-verifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4.3.0
        with: {name: verified-evidence, path: evidence/}
      - run: python tools/independent_verifier.py --evidence evidence/ast.json --verified evidence/verified.json --provenance evidence/provenance.json --output evidence/witness-report.json
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with: {name: witness-report, path: evidence/witness-report.json}
  security-dashboard:
    needs: witness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - run: python backend/ledger.py || echo done
  backend:
    needs: security-dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m pytest tests/ -v
  release-gate:
    needs: [ast-miron, rego-checker, code-analyze, dependency-audit, sast, evidence-verifier, witness, security-dashboard, backend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for j in ast-miron rego-checker code-analyze dependency-audit sast evidence-verifier witness security-dashboard backend; do echo $j; done
          if [ "${{ needs.ast-miron.result }}" != "success" ]; then echo BLOCKED; exit 1; fi
          echo APPROVED
