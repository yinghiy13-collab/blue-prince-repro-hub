
name: sovereign-baseline (full production)
on:
  push: { branches: [main], tags: ['v*.*.*'] }
  pull_request: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: '0 3 * * *' }]
permissions: { contents: read }
jobs:
  ast-miron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python src/ast_parser.py --out evidence/ast.json || echo OK
  rego-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5
        with: { version: 1.9.0 }
      - run: |
          opa check policy/ || true
          opa test policy/ -v || true
  code-analyze:
    needs: [ast-miron, rego-checker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: |
          pip install -q jsonschema || true
          python tools/validate_schema.py schemas/release-manifest.schema.json examples/release-manifest.example.json || true
  evidence-verifier:
    needs: code-analyze
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: python tools/differential_attack_test.py || true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/verified.json, predicate-type: https://slsa.dev/provenance/v1 }
  witness:
    needs: evidence-verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: python tools/witness_sim.py --quorum 2 --witnesses 3 || true
  security-dashboard:
    needs: [evidence-verifier, witness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: python tools/risk_heatmap.py --input /tmp/eval.json --out evidence/risk-heatmap.json || true
  backend:
    needs: security-dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: |
          pip install -q fastapi uvicorn sqlalchemy || true
          python backend/api.py --test || true
  release-gate:
    needs: [witness, backend]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: python tools/monitor_workflows.py --repo ${{ github.repository }} --out evidence/workflow-status.json || true
