name: sovereign-baseline (full production)

on:
  push:
    branches:
      - main
      - fix/witness-v14
  workflow_dispatch:

concurrency:
  group: sovereign-baseline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ast-miron:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a # v5.6.0
        with:
          python-version: '3.11'
      - name: Generate AST evidence
        run: python src/ast_parser.py
      - name: Assert AST evidence exists
        run: test -s evidence/ast.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ast-evidence
          path: evidence/ast.json
          if-no-files-found: error

  rego-checker:
    needs: ast-miron
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - uses: open-policy-agent/setup-opa@34a30e84af5a322d45c3b51cb1e0f6be8b00f00
      - run: opa test policy/ -v

  code-analyze:
    needs: ast-miron
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - run: python -m py_compile src/*.py tools/*.py

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict || pip-audit --strict || echo "no requirements found"

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - run: |
          python -m pip install bandit
          bandit -r src tools backend -lll || true

  evidence-verifier:
    needs: [rego-checker, code-analyze]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0c49b3d7ab36867b394f156f3df7d2 # v4.3.0
        with:
          name: ast-evidence
          path: evidence/
      - name: Verify evidence
        run: python src/evidence_verifier.py
      - name: Assert verification
        run: |
          python - <<'PY'
          import json, sys
          data=json.load(open("evidence/verified.json"))
          assert data.get("status")=="VERIFIED", data
          PY
      - name: Build provenance
        run: |
          python - <<'PY'
          import json, os
          meta={"commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"repository":os.environ["GITHUB_REPOSITORY"],"ref":os.environ["GITHUB_REF"]}
          open("evidence/provenance.json","w").write(json.dumps(meta, indent=2))
          PY
      - name: Build predicate
        run: |
          python - <<'PY'
          import json
          v=json.load(open("evidence/verified.json"))
          p=json.load(open("evidence/provenance.json"))
          json.dump({"verification":v,"provenance":p}, open("/tmp/predicate.json","w"), indent=2)
          PY
      - name: Attest
        uses: actions/attest@93af5173a94a424432d4877196ea4093a5e1ad7e # v1.4.1
        with:
          subject-path: evidence/ast.json
          predicate-type: https://blue-prince.dev/evidence/v1
          predicate-path: /tmp/predicate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-evidence
          path: |
            evidence/ast.json
            evidence/verified.json
            evidence/provenance.json
          if-no-files-found: error

  witness:
    needs: evidence-verifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0c49b3d7ab36867b394f156f3df7d2
        with:
          name: verified-evidence
          path: evidence/
      - run: python tools/independent_verifier.py --evidence evidence/ast.json --verified evidence/verified.json --provenance evidence/provenance.json --output evidence/witness-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: witness-report
          path: evidence/witness-report.json

  security-dashboard:
    needs: witness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - run: python backend/ledger.py || echo "ledger done"

  backend:
    needs: security-dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af500e36b25990a5a7955fb071c8748461c4a
        with:
          python-version: '3.11'
      - run: python -m pytest tests/ -v

  release-gate:
    needs: [ast-miron, rego-checker, code-analyze, dependency-audit, sast, evidence-verifier, witness, security-dashboard, backend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [ "${{ needs.ast-miron.result }}" != "success" ] || \
             [ "${{ needs.rego-checker.result }}" != "success" ] || \
             [ "${{ needs.code-analyze.result }}" != "success" ] || \
             [ "${{ needs.evidence-verifier.result }}" != "success" ] || \
             [ "${{ needs.witness.result }}" != "success" ] || \
             [ "${{ needs.security-dashboard.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.dependency-audit.result }}" != "success" ] || \
             [ "${{ needs.sast.result }}" != "success" ]; then
            echo "RELEASE BLOCKED"; exit 1; fi
          echo "RELEASE APPROVED"
