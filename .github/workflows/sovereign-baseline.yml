name: sovereign-baseline (full production)
on:
  push:
    branches:
      - main
      - fix/witness-v14
  workflow_dispatch:
# ... วาง YAML เต็มที่ผมให้ไป ...

# ทำแบบเดียวกันกับ tools/independent_verifier.py และ tests/test_witness.py
# และแก้ src/ast_parser.py, src/evidence_verifier.py ให้มี schema_version + evidence_sha256

# 5. ตรวจว่าไฟล์ครบ
!grep -A2 "branches:" .github/workflows/sovereign-baseline.yml
!grep -c "^def test_" tests/test_witness.py
!python -m pytest tests/test_witness.py -v
# ต้องเห็น 10 passed

# 6. Commit + Push
!git add .github/workflows/sovereign-baseline.yml tools/independent_verifier.py tests/test_witness.py src/ast_parser.py src/evidence_verifier.py
!git commit -m "feat: v14 SAME_COMMIT witness - trigger fix/witness-v14"
