name: validate-anchor (Gate 0)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify MEMORY_ANCHOR.lock (Fail-Closed)
        run: python src/memory_anchor_validator.py
