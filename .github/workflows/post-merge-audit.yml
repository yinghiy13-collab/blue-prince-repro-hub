name: Layer 3 - Post-Merge Audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Required Inputs
        run: |
          test -f src/memory_anchor_validator.py
          test -s MEMORY_ANCHOR.lock
          test -f evidence/ast.json
          test -f policy/build_gate.rego

      - name: Verify Anchor
        run: python src/memory_anchor_validator.py

      - name: Compute Anchor Digest
        id: anchor
        run: |
          DIGEST="$(sha256sum MEMORY_ANCHOR.lock | cut -d' ' -f1)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "MEMORY_ANCHOR.lock SHA-256: $DIGEST"

      - name: Generate Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'MEMORY_ANCHOR.lock'
