version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bprh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bprh_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bprh_db}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bprh"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-bprh_redis}
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bprh_click}
      CLICKHOUSE_DB: bprh_audit
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    command: run --server --addr :8181 /policies
    volumes: ["./policy:/policies:ro"]
    ports: ["8181:8181"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8181/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://bprh:bprh_secret@postgres:5432/bprh_db
      - REDIS_URL=redis://:bprh_redis@redis:6379/0
      - CLICKHOUSE_HOST=clickhouse
      - OPA_URL=http://opa:8181
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      opa: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # L0 Tracer (Profile: l0)
  l0-tracer:
    build: ./scripts/l0_tracer
    privileged: true
    pid: "host"
    profiles: ["l0"]
    volumes: ["/sys/kernel/debug:/sys/kernel/debug:rw"]

volumes:
  postgres_data:
